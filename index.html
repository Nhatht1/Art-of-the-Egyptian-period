<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nghệ thuật Ai Cập cổ đại</title>
  <style>
    html { overflow-y: scroll; }          /* luôn chừa chỗ cho thanh cuộn, tránh bị lệch ngang */
    body { margin: 0; background: #e9ecef; font-family: sans-serif; }
    #viewer { margin: 0; padding: 0; }
    canvas { display: block; width: 100%; height: auto; margin: 0 0 6px; background: #fff; }
    #status { padding: 24px; color: #555; text-align: center; }
  </style>
</head>
<body>
  <div id="viewer"><div id="status">Đang tải tài liệu...</div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = 'Art-of-the-Egyptian-period_compressed.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('viewer');
    let pdfDoc = null, renderId = 0, lastWidth = 0;

    async function renderAll() {
      if (!pdfDoc) return;
      const myId = ++renderId;
      const cssWidth = document.documentElement.clientWidth;   // vừa khít chiều ngang cửa sổ
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      viewer.innerHTML = '';
      for (let n = 1; n <= pdfDoc.numPages; n++) {
        const page = await pdfDoc.getPage(n);
        if (myId !== renderId) return;
        const unscaled = page.getViewport({ scale: 1 });
        const scale = (cssWidth / unscaled.width) * dpr;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        viewer.appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
    }

    pdfjsLib.getDocument(PDF_URL).promise
      .then(doc => { pdfDoc = doc; lastWidth = document.documentElement.clientWidth; renderAll(); })
      .catch(() => {
        viewer.innerHTML = '<div id="status">Không tải được file PDF. Kiểm tra lại tên file trong <code>PDF_URL</code>.</div>';
      });

    // Vẽ lại khi xoay điện thoại / đổi kích thước cửa sổ
    let timer;
    window.addEventListener('resize', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const w = document.documentElement.clientWidth;
        if (w !== lastWidth) { lastWidth = w; renderAll(); }
      }, 250);
    });
  </script>
</body>
</html>
